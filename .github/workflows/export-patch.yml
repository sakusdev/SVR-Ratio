name: Export RatioSlime working tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-patch.yml"
      - "patches/ratioslime.patch.gz.b64"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patched source
        shell: bash
        run: |
          base64 -d patches/ratioslime.patch.gz.b64 | gzip -dc > /tmp/ratioslime.patch
          git clone --filter=blob:none --no-checkout https://github.com/SlimeVR/SlimeVR-Server.git source
          git -C source fetch --depth 1 origin d7205bb2940de9c3c75921db19f5b9bc2b0bd9d9
          git -C source checkout --force d7205bb2940de9c3c75921db19f5b9bc2b0bd9d9
          git -C source submodule update --init --recursive
          git -C source apply /tmp/ratioslime.patch
          mkdir -p exported
          cp /tmp/ratioslime.patch exported/ratioslime.patch
          cp --parents \
            source/server/android/src/main/java/dev/slimevr/android/MainActivity.kt \
            source/server/android/src/main/java/dev/slimevr/android/RatioSettingsDialog.kt \
            source/server/android/src/main/java/dev/slimevr/android/RatioSettingsStore.kt \
            source/server/android/src/main/res/layout/activity_main.xml \
            source/server/core/src/main/java/dev/slimevr/tracking/processor/ratio/RatioCorrectionProcessor.kt \
            source/server/core/src/main/java/dev/slimevr/tracking/processor/ratio/RatioCorrectionSettings.kt \
            source/server/core/src/main/java/dev/slimevr/tracking/processor/skeleton/HumanSkeleton.kt \
            source/gui/src/components/settings/SettingsSidebar.tsx \
            exported/
      - name: Upload working files
        uses: actions/upload-artifact@v4
        with:
          name: ratioslime-working-tree
          path: exported
          retention-days: 1
